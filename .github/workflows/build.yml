name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q pf-passbook-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.x'
      - run: bash ci/setup.sh
        working-directory: epfo_passbook
      - run: flutter pub get
        working-directory: epfo_passbook
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: epfo_passbook
      - run: flutter test
        working-directory: epfo_passbook
      - run: bash ci/build.sh
        working-directory: epfo_passbook
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EPFO-PASSBOOK-apk
          path: epfo_passbook/build/app/outputs/flutter-apk/app-release.apk
